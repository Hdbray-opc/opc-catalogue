# Builds the Windows version of the E-2008 maintenance log (Carnet entretien E-2008, a portable .exe)
# and publishes it as a GitHub release, ready to download.
name: Carnet entretien E-2008 – application Windows
on:
  push:
    paths: ['e2008/**', 'desktop-e2008/**', 'entretien/fonts/**', '.github/workflows/e2008-exe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-e2008
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Carnet-entretien-E-2008-windows
          path: desktop-e2008/dist/*.exe
      - id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: e2008-v${{ steps.v.outputs.version }}
          name: Carnet entretien E-2008 ${{ steps.v.outputs.version }} (Windows)
          target_commitish: ${{ github.sha }}
          body: |
            Application Windows du carnet d'entretien de la Peugeot E-2008.
            Télécharger le fichier .exe ci-dessous puis le lancer (aucune installation).
            Si Windows affiche « Windows a protégé votre ordinateur » : Informations complémentaires › Exécuter quand même.
          files: desktop-e2008/dist/*.exe
          make_latest: false
